<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CareSync | Secure Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg-body: #0B0F14;
      --card-bg: rgba(21, 27, 35, 0.65);
      --input-bg: #111820;
      --text-main: #F1F5F9;
      --text-sec: #94A3B8;
      --text-muted: #64748B;
      --primary: #7C6CFF;
      --primary-hover: #9284FF;
      --primary-glow: rgba(124, 108, 255, 0.2);
      --accent: #38BDF8;
      --danger: #EF4444;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-active: rgba(255, 255, 255, 0.15);
      --shadow-floating: 0 30px 60px -10px rgba(0, 0, 0, 0.6);
      --radius-md: 12px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* --- AMBIENT BACKGROUND SYSTEM --- */
    .bg-grid {
      position: fixed; inset: 0; z-index: -2;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 24px 24px; pointer-events: none;
    }
    
    .ambient-orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      z-index: -1; opacity: 0.12; pointer-events: none;
      animation: float 25s infinite alternate ease-in-out;
    }
    .orb-primary {
      top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary);
    }
    .orb-accent {
      bottom: -10%; right: -5%; width: 40vw; height: 40vw; background: var(--accent);
      animation-delay: -12s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 8%) scale(1.05); }
    }

    /* --- GLASSMORPHISM PANEL --- */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-floating), inset 0 1px 0 rgba(255,255,255,0.05);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%; max-width: 420px; text-align: center;
      position: relative; z-index: 10;
    }

    /* --- STAGGERED ENTRANCE ANIMATIONS --- */
    .stagger-1 { animation: slideUp 0.7s var(--transition) 0.1s both; }
    .stagger-2 { animation: slideUp 0.7s var(--transition) 0.2s both; }
    .stagger-3 { animation: slideUp 0.7s var(--transition) 0.3s both; }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* --- BRAND & TYPOGRAPHY --- */
    .brand-icon {
      color: var(--primary); margin-bottom: 1.25rem; display: inline-block;
    }
    .brand-icon svg {
      animation: breathe 4s infinite ease-in-out;
    }
    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 8px var(--primary-glow)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 16px rgba(124, 108, 255, 0.5)); transform: scale(1.04); }
    }

    h1 { font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-sec); font-size: 0.95rem; margin-bottom: 2.5rem; }

    /* --- FORMS & INPUTS --- */
    .pin-input {
      width: 100%; letter-spacing: 1.5rem; font-size: 1.75rem; text-align: center;
      font-weight: 700; padding: 1.15rem; padding-left: 2.65rem; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); font-family: inherit; background: var(--input-bg);
      color: var(--text-main); transition: var(--transition); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .pin-input:focus { 
      outline: none; border-color: var(--primary); background: #171d26;
      box-shadow: 0 0 0 4px var(--primary-glow), inset 0 2px 4px rgba(0,0,0,0.2); 
    }

    .field-error {
      color: var(--danger); background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px; padding: 0.75rem; font-size: 0.9rem; font-weight: 500; margin-top: 1.25rem;
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* --- BUTTON INTERACTIONS --- */
    button {
      margin-top: 1.75rem; width: 100%; background: var(--primary); color: #fff;
      border: none; border-radius: var(--radius-md); padding: 1.1rem;
      font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: var(--transition); box-shadow: 0 4px 14px var(--primary-glow);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    button:hover { 
      background: var(--primary-hover); transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 108, 255, 0.3);
    }
    button:active { transform: translateY(1px) scale(0.98); box-shadow: 0 2px 8px var(--primary-glow); }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .ambient-orb { animation: none; }
      .brand-icon svg { animation: none; }
      .stagger-1, .stagger-2, .stagger-3 { animation: none; opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    /* --- MOBILE ORB FIX --- */
    @media (max-width: 768px) {
      .ambient-orb { filter: blur(60px); opacity: 0.15; }
      .orb-primary { width: 80vw; height: 80vw; left: -15%; top: -5%; }
      .orb-accent { width: 80vw; height: 80vw; right: -15%; bottom: -5%; }
    }
  </style>
</head>
<body>

  <!-- Animated Background System -->
  <div class="bg-grid"></div>
  <div class="ambient-orb orb-primary"></div>
  <div class="ambient-orb orb-accent"></div>

  <div class="glass-panel">
    <div class="stagger-1">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <h1>CareSync Portal</h1>
      <p class="subtitle">Secure authentication required.</p>
    </div>

    <form method="POST" action="/caregiver/login" class="stagger-2" id="loginForm">
      <input type="tel" inputmode="numeric" maxlength="4" name="pin"
             class="pin-input" placeholder="••••" autocomplete="off" autofocus required>
             
      <button type="submit" id="submitBtn">Unlock Dashboard</button>
    </form>

    {% if error %}
      <div class="field-error stagger-3">{{ error }}</div>
    {% endif %}
  </div>

  <script>
    // Smooth loading state microinteraction
    document.getElementById('loginForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      btn.style.pointerEvents = 'none';
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; animation: spin 1s linear infinite;">
          <line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg> 
        Authenticating...`;
    });
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
