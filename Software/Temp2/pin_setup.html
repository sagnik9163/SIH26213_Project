<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CareSync | Initial Setup</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg-body: #0B0F14;
      --card-bg: rgba(21, 27, 35, 0.65);
      --input-bg: #111820;
      --text-main: #F1F5F9;
      --text-sec: #94A3B8;
      --text-muted: #64748B;
      --primary: #7C6CFF;
      --primary-hover: #9284FF;
      --primary-glow: rgba(124, 108, 255, 0.2);
      --accent: #38BDF8;
      --danger: #EF4444;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-active: rgba(255, 255, 255, 0.15);
      --shadow-floating: 0 30px 60px -10px rgba(0, 0, 0, 0.6);
      --radius-md: 12px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font); background: var(--bg-body); color: var(--text-main);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
    }

    /* --- AMBIENT BACKGROUND --- */
    .bg-grid { position: fixed; inset: 0; z-index: -2; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
    .ambient-orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.12; pointer-events: none; animation: float 25s infinite alternate ease-in-out; }
    .orb-primary { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); }
    .orb-accent { bottom: -10%; right: -5%; width: 40vw; height: 40vw; background: var(--accent); animation-delay: -12s; }
    @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 8%) scale(1.05); } }

    /* --- GLASSMORPHISM PANEL --- */
    .glass-panel {
      background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle); box-shadow: var(--shadow-floating), inset 0 1px 0 rgba(255,255,255,0.05);
      border-radius: var(--radius-lg); padding: 2.5rem; width: 100%; max-width: 500px;
      position: relative; z-index: 10;
    }

    .stagger-1 { animation: slideUp 0.7s var(--transition) 0.1s both; }
    .stagger-2 { animation: slideUp 0.7s var(--transition) 0.2s both; }
    .stagger-3 { animation: slideUp 0.7s var(--transition) 0.3s both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

    .header-text { text-align: center; margin-bottom: 2.5rem; }
    h1 { font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p.subtitle { color: var(--text-sec); font-size: 0.95rem; }

    /* --- SETUP PROGRESS INDICATOR --- */
    .progress-bar { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 2.5rem; }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-active); transition: var(--transition); }
    .step-dot.active { background: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
    .step-line { height: 2px; width: 40px; background: var(--border-active); border-radius: 2px; }
    .step-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    /* --- FORM SECTIONS --- */
    .form-group { margin-bottom: 2rem; }
    .group-title { font-size: 0.9rem; font-weight: 600; color: var(--primary); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
    
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sec); margin-bottom: 0.5rem; margin-top: 1.25rem; }
    label:first-of-type { margin-top: 0; }
    
    .text-input {
      width: 100%; padding: 0.9rem 1.1rem; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); font-family: inherit; font-size: 0.95rem;
      background: var(--input-bg); color: var(--text-main); transition: var(--transition);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .text-input::placeholder { color: var(--text-muted); }
    .text-input:focus { outline: none; border-color: var(--primary); background: #171d26; box-shadow: 0 0 0 4px var(--primary-glow), inset 0 2px 4px rgba(0,0,0,0.2); }

    .pin-input {
      width: 100%; letter-spacing: 1.25rem; font-size: 1.5rem; text-align: center;
      font-weight: 700; padding: 0.85rem; padding-left: 2.1rem; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); font-family: inherit; background: var(--input-bg);
      color: var(--text-main); transition: var(--transition); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .pin-input:focus { outline: none; border-color: var(--primary); background: #171d26; box-shadow: 0 0 0 4px var(--primary-glow), inset 0 2px 4px rgba(0,0,0,0.2); }

    .field-error { color: var(--danger); background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 0.75rem; font-size: 0.9rem; font-weight: 500; margin-top: 1.25rem; text-align: center; animation: shake 0.4s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    button { margin-top: 2.5rem; width: 100%; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-md); padding: 1.1rem; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: var(--transition); box-shadow: 0 4px 14px var(--primary-glow); display: flex; align-items: center; justify-content: center; gap: 0.5rem;}
    button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 108, 255, 0.3); }
    button:active { transform: translateY(1px) scale(0.98); box-shadow: 0 2px 8px var(--primary-glow); }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .ambient-orb { animation: none; }
      .stagger-1, .stagger-2, .stagger-3 { animation: none; opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    /* --- MOBILE ORB FIX --- */
    @media (max-width: 768px) {
      .ambient-orb { filter: blur(60px); opacity: 0.15; }
      .orb-primary { width: 80vw; height: 80vw; left: -15%; top: -5%; }
      .orb-accent { width: 80vw; height: 80vw; right: -15%; bottom: -5%; }
    }
  </style>
</head>
<body>

  <!-- Ambient Background System -->
  <div class="bg-grid"></div>
  <div class="ambient-orb orb-primary"></div>
  <div class="ambient-orb orb-accent"></div>

  <div class="glass-panel">
    <div class="stagger-1">
      <div class="header-text">
        <h1>Welcome to CareSync</h1>
        <p class="subtitle">Complete your initial dashboard setup.</p>
      </div>

      <!-- Visual Progress Indicator -->
      <div class="progress-bar">
        <span class="step-label">Identity</span>
        <div class="step-dot active"></div>
        <div class="step-line"></div>
        <div class="step-dot active"></div>
        <span class="step-label">Security</span>
      </div>
    </div>

    <form method="POST" action="/caregiver/setup" class="stagger-2" id="setupForm">
      
      <!-- 1. Identity Section -->
      <div class="form-group">
        <div class="group-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Patient Profile
        </div>
        
        <label for="caregiver_name">Caregiver Name</label>
        <input type="text" name="caregiver_name" id="caregiver_name" class="text-input" placeholder="e.g. John Doe" required>

        <label for="patient_name">Patient Name</label>
        <input type="text" name="patient_name" id="patient_name" class="text-input" placeholder="e.g. Jane Doe" required>

        <label for="patient_age">Patient Age</label>
        <input type="number" name="patient_age" id="patient_age" class="text-input" placeholder="e.g. 72" required>
      </div>

      <!-- 2. Security Section -->
      <div class="form-group" style="margin-top: 2.5rem; border-top: 1px solid var(--border-subtle); padding-top: 2rem;">
        <div class="group-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Dashboard Security
        </div>

        <label for="pin">Create a 4-Digit Security PIN</label>
        <input type="tel" inputmode="numeric" maxlength="4" name="pin" id="pin"
               class="pin-input" placeholder="••••" autocomplete="off" required>

        <label for="confirm">Confirm PIN</label>
        <input type="tel" inputmode="numeric" maxlength="4" name="confirm" id="confirm"
               class="pin-input" placeholder="••••" autocomplete="off" required>
      </div>

      <button type="submit" id="submitBtn">Complete Configuration</button>
    </form>
    
    {% if error %}
      <div class="field-error stagger-3">{{ error }}</div>
    {% endif %}
  </div>

  <script>
    // Smooth loading state microinteraction
    document.getElementById('setupForm').addEventListener('submit', function() {
      const btn = document.getElementById('submitBtn');
      btn.style.pointerEvents = 'none';
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; animation: spin 1s linear infinite;">
          <line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg> 
        Configuring System...`;
    });
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
  </script>
</body>
</html>
